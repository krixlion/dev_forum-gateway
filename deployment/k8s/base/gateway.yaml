apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-d
spec:
  selector:
    matchLabels:
      app: gateway
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gateway
    spec:
      restartPolicy: Always
      containers:
        - envFrom:
            - configMapRef:
                name: gateway-env
          image: "krixlion/dev_forum-gateway:0.1.0"
          imagePullPolicy: IfNotPresent
          name: server
          args: []
          ports:
            - name: http
              containerPort: 80
          resources:
            limits:
              cpu: 20m
              memory: 150Mi
            requests:
              cpu: 5m
              memory: 80Mi
          volumeMounts: []
      volumes: []
