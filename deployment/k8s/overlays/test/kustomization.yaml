resources:
  - ../../base

namespace: test

replicas:
  - name: gateway-d
    count: 1

configMapGenerator:
  - name: gateway-env

patches:
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "-insecure=true"
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: 2000m
            memory: 750Mi
          requests:
            cpu: 500m
            memory: 250Mi
    target:
      group: apps
      version: v1
      kind: Deployment
      name: gateway-d
